apiVersion: batch/v1
kind: CronJob
metadata:
  name: claims-lakehouse-sync
  namespace: claims-ai
spec:
  schedule: "0 */2 * * *" # Runs every 2 hours
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            job: claims-lakehouse-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pipeline-runner
              image: claimsinsightcr.azurecr.io/claims-pipeline-runner:TAG_PLACEHOLDER
              imagePullPolicy: Always
              args: ["run-lakehouse-sync"]
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2000m"
                  memory: "4Gi"
              envFrom:
                - configMapRef:
                    name: claims-pipeline-config
                - secretRef:
                    name: claims-pipeline-secrets