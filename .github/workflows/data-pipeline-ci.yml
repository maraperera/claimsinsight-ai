name: Claims Lakehouse Docker CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACR_NAME: claimsinsightcr2026
  IMAGE_NAME: claims-pipeline-runner

jobs:
  # 1. Reusable Workflow Call
  call-terraform:
    uses: ./.github/workflows/terraform-deploy.yml
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  # 2. Application Lint & Unit Tests (Runs in parallel)
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r requirements-pipeline.txt

      - name: Lint with Flake8
        run: flake8 src/ scripts/ tests/ --count --max-line-length=120 --statistics || true

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ --cov=src/pipeline_utils --cov-report=xml || true

  # 3. Docker Pipeline Execution
  build-push-and-execute:
    needs: [lint-and-test, call-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Pipeline Docker Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} -f docker/Dockerfile.pipeline .
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Run Full Pipeline in Docker
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: |
          docker run --rm \
            -e AZURE_STORAGE_ACCOUNT_NAME="${{ env.AZURE_STORAGE_ACCOUNT_NAME }}" \
            -e AZURE_STORAGE_ACCOUNT_KEY="${{ env.AZURE_STORAGE_ACCOUNT_KEY }}" \
            -e AZURE_OPENAI_API_KEY="${{ env.AZURE_OPENAI_API_KEY }}" \
            -e AZURE_OPENAI_ENDPOINT="${{ env.AZURE_OPENAI_ENDPOINT }}" \
            -e AZURE_OPENAI_EMBEDDING_DEPLOYMENT="${{ env.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest