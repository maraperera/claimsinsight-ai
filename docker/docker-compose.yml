services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: claimsinsight-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: claimsinsight-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/v1/claims/query
    depends_on:
      - api
    restart: unless-stopped